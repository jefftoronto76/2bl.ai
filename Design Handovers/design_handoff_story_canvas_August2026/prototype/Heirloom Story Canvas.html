<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heirloom — Story Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--hl-bg:#FAF6EE;--hl-bg-2:#F2ECDF;--hl-surface:#FFFFFF;--hl-surface-2:#F4EFE5;--hl-accent:#C8542E;--hl-accent-hover:#A93F1D;--hl-accent-soft:color-mix(in srgb,#C8542E 13%,transparent);--hl-accent-line:color-mix(in srgb,#C8542E 30%,transparent);--hl-text:#1A150F;--hl-muted:#6B6256;--hl-faint:#9A917F;--hl-border:#E6DCC8;--hl-border-strong:color-mix(in srgb,#C8542E 42%,transparent);--hl-on-accent:#FFFFFF;--hl-shadow:rgba(26,21,15,0.30);--hl-danger:#B0432F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',ui-monospace,monospace}
html,body{margin:0;padding:0}
body{background:var(--hl-bg-2);color:var(--hl-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--hl-accent);text-decoration:none}a:hover{color:var(--hl-accent-hover)}
::selection{background:var(--hl-accent-soft);color:var(--hl-text)}
.lg-scroll{scrollbar-width:thin;scrollbar-color:var(--hl-border) transparent}
.lg-scroll::-webkit-scrollbar{width:9px}.lg-scroll::-webkit-scrollbar-thumb{background:var(--hl-border);border-radius:9px;border:2px solid transparent;background-clip:content-box}
@keyframes scBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
@keyframes sc-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes sc-slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
textarea,input{font-family:inherit}
#root{min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#C8542E"/><g transform="translate(36,36)" fill="none" stroke="#FAF6EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M44 22a12 12 0 0 0-17-17L10 21v17h17z"/><path d="M34 15 4 45"/></g></svg></template>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="story-canvas-nav.jsx"></script>
<script type="text/babel" src="story-canvas.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<StoryCanvas />);
</script>
</body>
</html>
