<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · Second Brain Labs — Combined</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ── Mantine token bridge (from adminTheme + default Mantine palettes) ── */
  :root {
    --dark-9:#101113; --dark-8:#141517; --dark-7:#1A1B1E; --dark-6:#2C2E33; --dark-5:#373A40;
    --gray-0:#f8f9fa; --gray-1:#f1f3f5; --gray-2:#e9ecef; --gray-3:#dee2e6; --gray-4:#ced4da;
    --gray-5:#adb5bd; --gray-6:#868e96; --gray-7:#495057; --gray-8:#343a40; --gray-9:#212529;
    --green-5:#4fa574; --green-6:#2d6a4f; --green-7:#245741; --green-8:#1b4433;
    --red-6:#e03131; --red-5:#fa5252; --red-light:#fff5f5; --red-light-fg:#c92a2a;

    --text:#1a1917; --muted:rgba(26,25,23,0.55); --body-bg:#f9f8f5;

    --font: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --head: "Playfair Display", serif;
    --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-display: "Playfair Display", serif;

    --r-xs:2px; --r-sm:4px; --r-md:8px; --r-lg:12px;
    --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px;
    --shadow-md:0 4px 6px rgba(0,0,0,0.06);
    --shadow-lg:0 10px 15px rgba(0,0,0,0.06);
    --shadow-xl:0 20px 25px rgba(0,0,0,0.06), 0 8px 10px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--body-bg);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: rgba(45,106,79,0.18); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray-3); border-radius: 8px; border:2px solid #fff; }
  .nav-scroll::-webkit-scrollbar-thumb { background: var(--dark-5); border-color: var(--dark-9); }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--body-bg); color: var(--gray-5);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  }

  /* ── Blocks overview (combined-only) ── */
  .blocks-overview {
    display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
    gap: 20px; margin-bottom: 20px; align-items: stretch;
  }
  .blocks-overview .ucard { padding: 22px; }
  .po-left { display: flex; flex-direction: column; gap: 18px; }
  .po-left .def-grid { margin-top: 0; }
  .blocks-overview .def-grid .dk, .blocks-overview .def-grid .dv { padding: 11px 14px; font-size: 14px; }
  .po-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; padding-top: 2px; }
  .po-actions .btn { flex: 1 1 auto; justify-content: center; }
  .po-right { display: flex; flex-direction: column; align-items: center; gap: 20px; justify-content: center; }
  .po-right > svg { flex: 0 0 auto; }
  .donut-hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-5); text-align: center; }
  .donut-legend { display: flex; flex-direction: column; gap: 11px; width: 100%; }
  .dl-item { display: flex; align-items: center; gap: 9px; font-size: 13px; min-width: 0; }
  .dl-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .dl-name { color: var(--text); white-space: nowrap; }
  .dl-val { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 860px) {
    .blocks-overview { grid-template-columns: 1fr; }
  }

  /* Current Prompt Set picker — Blocks header ── */
  .hb-promptset { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 0 0 auto; }
  .hb-ps-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray-6); white-space: nowrap; }
  .ps-select { position: relative; }
  .ps-trigger {
    display: inline-flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 9px 0 14px;
    border: 1px solid var(--gray-3); border-radius: var(--r-sm); background: #fff;
    color: var(--text); font-size: 14px; font-weight: 600;
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .ps-trigger:hover { border-color: var(--gray-4); background: var(--gray-0); }
  .ps-name { white-space: nowrap; }
  .ps-caret { color: var(--gray-6); transition: transform 150ms ease; }
  .ps-caret.open { transform: rotate(90deg); }
  .ps-badge { display: inline-flex; align-items: center; height: 19px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  .ps-badge.live { background: rgba(45,106,79,0.12); color: #2d6a4f; }
  .ps-badge.draft { background: rgba(245,159,0,0.14); color: #e67700; }
  .ps-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 30;
    min-width: 272px; background: #fff; border: 1px solid var(--gray-3);
    border-radius: var(--r-sm); box-shadow: var(--shadow-lg); padding: 4px;
    animation: fade 100ms ease;
  }
  .ps-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: transparent; border-radius: var(--r-sm); padding: 9px 10px; font-size: 13.5px; color: var(--text); }
  .ps-item:hover { background: var(--gray-1); }
  .ps-item.on { background: rgba(45,106,79,0.07); }
  .ps-item-name { font-weight: 500; white-space: nowrap; }
  .ps-item-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }
  .ps-item-check { display: inline-flex; width: 14px; color: var(--green-6); flex: 0 0 auto; }

  /* Sticky search/filter bar — locks at top of the blocks scroll region ── */
  .screen-scroll.blocks-scroll { padding-top: 0; }
  .blocks-scroll .blocks-overview { margin-top: 20px; }
  .blocks-sticky {
    position: sticky; top: 0; z-index: 6;
    background: #fff;
    margin: 0 -24px 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--gray-2);
  }
  @media (max-width: 768px) {
    .blocks-sticky { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
  }
</style>
<link rel="stylesheet" href="tenant-admin/styles.css" />
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#101113"/>
      <rect x="30" y="30" width="40" height="40" rx="6" fill="#2d6a4f"/>
      <text x="50" y="57" font-family="Georgia, serif" font-size="22" fill="#fff" text-anchor="middle">2BL</text>
    </svg>
  </template>
  <div id="boot">Loading admin · Second Brain Labs</div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared modules (reused untouched from the tenant-admin build) -->
  <script type="text/babel" src="tenant-admin/data.jsx"></script>
  <script type="text/babel" src="tenant-admin/icons.jsx"></script>
  <script type="text/babel" src="tenant-admin/ui.jsx"></script>
  <script type="text/babel" src="tenant-admin/inbound.jsx"></script>
  <script type="text/babel" src="tenant-admin/studio.jsx"></script>
  <script type="text/babel" src="tenant-admin/settings.jsx"></script>
  <script type="text/babel" src="combined/blocks.jsx"></script>
  <script type="text/babel" src="tenant-admin/composer.jsx"></script>
  <script type="text/babel" src="tenant-admin/members.jsx"></script>

  <!-- Combined-only: ported Platform Tenants screen + merged shell -->
  <script type="text/babel" src="combined/tenants.jsx"></script>
  <script type="text/babel" src="combined/app.jsx"></script>
</body>
</html>
