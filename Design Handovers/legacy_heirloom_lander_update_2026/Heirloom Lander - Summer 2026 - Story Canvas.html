<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heirloom — Lander + Story Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Legacy storefront tokens — flat egg-shell base, terracotta accent (#C8542E). */
    --hl-bg: #FAF6EE;
    --hl-bg-2: #F2ECDF;
    --hl-surface: #FFFFFF;
    --hl-surface-2: #F4EFE5;
    --hl-accent: #C8542E;
    --hl-accent-hover: #A93F1D;
    --hl-accent-soft: color-mix(in srgb, #C8542E 13%, transparent);
    --hl-accent-line: color-mix(in srgb, #C8542E 30%, transparent);
    --hl-text: #1A150F;
    --hl-muted: #6B6256;
    --hl-faint: #9A917F;
    --hl-border: #E6DCC8;
    --hl-border-strong: color-mix(in srgb, #C8542E 42%, transparent);
    --hl-glow-1: #F2E7CF;
    --hl-glow-2: #ECE0C6;
    --hl-on-accent: #FFFFFF;
    --hl-shadow: rgba(26,21,15,0.30);

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'DM Mono', ui-monospace, monospace;
    --font-hand: 'Caveat', 'Cormorant Garamond', cursive;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--hl-bg);
    color: var(--hl-text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  #root { min-height: 100vh; }
  ::selection { background: var(--hl-accent-soft); color: var(--hl-text); }
  button { font-family: inherit; cursor: pointer; }

  /* Gold-cross pattern, recoloured to terracotta for the hero wash. */
  .bg-pattern-dots {
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C8542E' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── Footer ── */
  .hl-foot { position: relative; z-index: 2; background: transparent; color: var(--hl-text); border-top: 1px solid var(--hl-accent); padding: 64px 24px 36px; }
  .hl-foot-wrap { max-width: 1180px; margin: 0 auto; }
  .hl-foot-top { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 40px; margin-bottom: 56px; }
  .hl-foot-mark { font-family: var(--font-display); font-size: 28px; font-weight: 500; margin: 0 0 14px; color: var(--hl-text); letter-spacing: -0.005em; }
  .hl-foot-mark em { font-style: italic; color: var(--hl-accent); font-weight: 400; }
  .hl-foot-blurb { color: var(--hl-muted); font-size: 14px; max-width: 36ch; line-height: 1.6; margin: 0; }
  .hl-foot h5 { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--hl-faint); margin: 0 0 16px; }
  .hl-foot-links { display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
  .hl-foot-links a { color: var(--hl-muted); text-decoration: none; transition: color .15s ease; }
  .hl-foot-links a:hover { color: var(--hl-text); }
  .hl-foot-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 28px; border-top: 1px solid var(--hl-border); font-size: 12.5px; color: var(--hl-faint); }
  .hl-foot-bottom .hl-foot-markline { font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--hl-muted); }

  /* ── Motion ── */
  @keyframes hl-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
  @keyframes hl-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .reveal { opacity: 0; }
  .reveal.in { animation: hl-rise 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity: 1 !important; animation: none !important; transform: none !important; }
    [style*="hl-bob"] { animation: none !important; }
  }

  /* ── Memory constellation ── */
  .mc-scaler { position: relative; width: 100%; }
  .mc-canvas { position: absolute; top: 0; left: 0; width: 1080px; height: 840px; transform-origin: top left; }
  .mc-el { position: absolute; }
  .mc-photo { border-radius: 14px; overflow: hidden; box-shadow: 0 18px 34px -14px var(--hl-shadow), 0 2px 6px -2px rgba(26,21,15,0.18); background: var(--hl-surface-2); }
  .mc-photo image-slot { display: block; width: 100%; height: 100%; }
  .mc-card { background: var(--hl-surface); border: 1px solid var(--hl-border); border-radius: 16px; box-shadow: 0 14px 30px -16px var(--hl-shadow), 0 1px 3px rgba(26,21,15,0.06); }
  .mc-paper { background: linear-gradient(180deg, #FBF6EA, #F3EAD6); border: 1px solid var(--hl-border); border-radius: 6px; box-shadow: 0 12px 26px -14px var(--hl-shadow); }
  .mc-hand { font-family: var(--font-hand); color: #5c4a36; }
  .mc-wave { display: flex; align-items: center; gap: 2px; height: 34px; overflow: hidden; }
  .mc-wave span { flex: 0 0 auto; width: 2.5px; border-radius: 2px; }
  .mc-play { flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; }
  .mc-conn { position: absolute; inset: 0; width: 1080px; height: 840px; overflow: visible; pointer-events: none; }
  .mc-conn path { animation: mc-dash 40s linear infinite; }
  @keyframes mc-dash { to { stroke-dashoffset: -400; } }
  @media (prefers-reduced-motion: reduce) { .mc-conn path { animation: none !important; } }

  /* ── Page thread (scroll-drawn guide) ── */
  .thread-layer { position: absolute; top: 0; left: 0; width: 100%; z-index: 3; pointer-events: none; }
  .thread-svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .thread-track { fill: none; stroke: var(--hl-accent); opacity: 0.16; stroke-width: 2; stroke-dasharray: 2 9; stroke-linecap: round; }
  .thread-live { fill: none; stroke: var(--hl-accent); stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; filter: drop-shadow(0 1px 3px color-mix(in srgb, var(--hl-accent) 30%, transparent)); }
  .thread-bead { position: absolute; transform: translate(-50%, -50%) scale(0.7); opacity: 0; transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1); will-change: transform, opacity; }
  .thread-bead.lit { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .thread-bead .bead-photo { border-radius: 13px; overflow: hidden; box-shadow: 0 16px 30px -14px var(--hl-shadow), 0 2px 5px -2px rgba(26,21,15,0.16); background: var(--hl-surface-2); pointer-events: auto; }
  .thread-bead .bead-photo image-slot { display: block; width: 100%; height: 100%; }
  .thread-bead .bead-cap { margin-top: 9px; text-align: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--hl-accent); }
  .thread-dot { position: absolute; transform: translate(-50%,-50%) scale(0.4); opacity: 0; width: 13px; height: 13px; border-radius: 999px; background: var(--hl-bg); border: 2.5px solid var(--hl-accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--hl-accent) 12%, transparent); transition: opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1); }
  .thread-dot.lit { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* Book convergence */
  .gather-chip { position: absolute; border-radius: 11px; overflow: hidden; box-shadow: 0 14px 26px -12px var(--hl-shadow); background: var(--hl-surface-2); transition: transform 1.1s cubic-bezier(.22,1,.36,1), opacity .8s ease; opacity: 0; }
  .gather-chip image-slot { display: block; width: 100%; height: 100%; }
  .book-gather { position: relative; }
  .gather-chip { transform: translate(calc(-50% + var(--sx,0px)), calc(-50% + var(--sy,0px))) rotate(var(--sr,0deg)); }
  .book-feature.in .gather-chip { transform: translate(calc(-50% + var(--ex,0px)), calc(-50% + var(--ey,0px))) rotate(var(--er,0deg)); opacity: 1; }

  .hl-labeling image-slot { position: relative; }
  .hl-labeling image-slot::after { content: attr(id); position: absolute; top: 4px; left: 4px; z-index: 40; background: #1a150f; color: #fff; font-family: var(--font-mono); font-size: 10px; letter-spacing: .02em; padding: 3px 7px; border-radius: 5px; pointer-events: none; }
  .label-toggle-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--hl-border-strong); background: var(--hl-surface); color: var(--hl-text); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 14px 34px -12px var(--hl-shadow); }
  @media (prefers-reduced-motion: reduce) {
    .thread-bead, .thread-dot, .gather-chip { transition: none !important; opacity: 1 !important; transform: translate(-50%,-50%) !important; }
    .gather-chip { transform: none !important; }
  }


  /* ── Responsive ── */
  @media (max-width: 920px) {
    .hero-cover-grid { grid-template-columns: 1fr !important; gap: 8px !important; }
    .hero-cover-grid > .hero-collage-col { display: flex !important; }
    .how-grid { grid-template-columns: repeat(2,1fr) !important; }
    .roles-grid { grid-template-columns: repeat(2,1fr) !important; }
    .personas-grid { grid-template-columns: 1fr !important; }
    .personas-grid > div { grid-column: auto !important; }
    .addons-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 820px) {
    .book-feature { grid-template-columns: 1fr !important; }
    .book-feature .book-photo-cell { min-height: 320px !important; }
  }
  @media (max-width: 768px) {
    .nav-links { display: none !important; }
    .nav-login { display: none !important; }
    .nav-burger { display: flex !important; }
    .nav-mobile-menu { display: block !important; }
    .whatis-grid { grid-template-columns: 1fr !important; }
    .diff-grid { grid-template-columns: 1fr !important; }
    .hero-tagline { white-space: normal !important; }
  }
  @media (max-width: 620px) {
    .roles-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 560px) {
    .how-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 760px) {
    .hl-foot-top { grid-template-columns: 1fr 1fr; gap: 32px; }
  }
  @media (max-width: 460px) {
    .hl-foot-top { grid-template-columns: 1fr; gap: 28px; }
    .hl-foot { padding: 48px 22px 32px; }
    .hl-foot-bottom { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>

  <script type="text/babel">
  const { useState, useEffect, useRef } = React;

  /* ─── Icons (lucide subset) ─────────────────────────────────────────── */
  const ICON_PATHS = {

  };
  function Icon({ name, size = 18, strokeWidth = 1.75, style }) {
    const d = ICON_PATHS[name] || [];
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} aria-hidden="true">
        {d.map((p, i) => <path key={i} d={p} />)}
      </svg>
    );
  }

  /* ─── Reveal hook ───────────────────────────────────────────────────── */
  function useReveal() {
    const ref = useRef(null);
    const [seen, setSeen] = useState(false);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); obs.disconnect(); } }, { threshold: 0.12 });
      obs.observe(el);
      const fb = setTimeout(() => setSeen(true), 1300);
      const r = el.getBoundingClientRect();
      if (r.top < (window.innerHeight || 800)) setSeen(true);
      return () => { obs.disconnect(); clearTimeout(fb); };
    }, []);
    return [ref, seen];
  }

  /* All “Start Your Story” CTAs open the story chat drawer. */
  const startStory = () => window.dispatchEvent(new CustomEvent('legacy-open-chat'));
  const openStories = () => window.dispatchEvent(new CustomEvent('legacy-open-story'));

  /* ─── Shared CTA buttons ────────────────────────────────────────────── */
  function PrimaryCta({ children, onClick }) {
    return (
      <button onClick={onClick} style={{ background: 'var(--hl-accent)', color: 'var(--hl-on-accent)', fontWeight: 600, fontSize: 16, padding: '16px 30px', borderRadius: 13, border: 'none', transition: 'background .2s' }}
        onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--hl-accent-hover)'; }}
        onMouseLeave={(e) => { e.currentTarget.style.background = 'var(--hl-accent)'; }}>
        {children}
      </button>
    );
  }
  function GhostCta({ children, onClick }) {
    return (
      <button onClick={onClick} style={{ background: 'transparent', color: 'var(--hl-accent)', fontWeight: 600, fontSize: 16, padding: '16px 30px', borderRadius: 13, border: '1px solid var(--hl-accent-line)', transition: 'all .2s' }}
        onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--hl-accent-soft)'; e.currentTarget.style.color = 'var(--hl-text)'; e.currentTarget.style.borderColor = 'var(--hl-accent)'; }}
        onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--hl-accent)'; e.currentTarget.style.borderColor = 'var(--hl-accent-line)'; }}>
        {children}
      </button>
    );
  }
  const Eyebrow = ({ children, style }) => (
    <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, letterSpacing: '.3em', textTransform: 'uppercase', color: 'var(--hl-accent)', display: 'block', ...style }}>{children}</span>
  );

  /* ─── 1. Nav ────────────────────────────────────────────────────────── */
  function Nav() {
    const [scrolled, setScrolled] = useState(false);

  function mcEdge(b, tx, ty, m) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    let dx = tx - cx, dy = ty - cy;

    const t = 1 / Math.max(Math.abs(dx) / (b.w / 2), Math.abs(dy) / (b.h / 2));

  /* ─── Page thread — scroll-drawn guide through the whole page ────────── */
  const TH_CAPS = ['Family', 'Pets', 'Friendships', 'A day', 'A song', 'A trip'];
  function PageThread() {
    const layerRef = useRef(null);
    const [geo, setGeo] = useState({ W: 0, H: 0, d: '', beads: [] });
    const [front, setFront] = useState(0);
    const build = React.useCallback(() => {
      const layer = layerRef.current; if (!layer) return;
      const W = document.documentElement.clientWidth;
      const H = document.body.scrollHeight;
      const edge = Math.max(20, Math.min(72, (W - 1180) / 2 - 22));
      const xL = edge, xR = W - edge;
      const secs = [...document.querySelectorAll('[data-screen-label]')];
      const pts = [];
      const bottoms = [];
      secs.forEach((s, i) => {
        const r = s.getBoundingClientRect();
        const top = r.top + window.scrollY, bot = r.bottom + window.scrollY;
        const side = i % 2 === 0 ? xL : xR;
        const inset = Math.min(80, r.height * 0.16);
        pts.push([side, top + inset]);
        pts.push([side, bot - inset]);
        bottoms.push({ y: bot - inset });
      });
      const beads = [];
      let photoN = 0;
      for (let t = 0; t < bottoms.length - 1; t++) {
        const yMid = (bottoms[t].y + pts[(t + 1) * 2][1]) / 2;
        const isPhoto = t % 2 === 0 && t < bottoms.length - 2 && W > 720;
        if (isPhoto) {
          beads.push({ key: 't' + t, photo: true, id: 'th-bead-' + t, cap: TH_CAPS[photoN % TH_CAPS.length], x: W / 2, y: yMid, w: 108, h: 82 });
          photoN++;
        } else {
          beads.push({ key: 't' + t, photo: false, x: W / 2, y: yMid });
        }
      }
      setGeo({ W, H, d: mcPath(pts), beads });
    }, []);
    useEffect(() => {
      build();
      let raf = 0;
      const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setFront(window.scrollY + window.innerHeight * 0.6)); };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', build);
      const ro = new ResizeObserver(build); ro.observe(document.body);
      onScroll();
      const t1 = setTimeout(build, 400), t2 = setTimeout(build, 1400);
      return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', build); ro.disconnect(); cancelAnimationFrame(raf); clearTimeout(t1); clearTimeout(t2); };
    }, [build]);
    const { W, H, d, beads } = geo;
    return (
      <div className="thread-layer" ref={layerRef} aria-hidden="true">
        <svg className="thread-svg" width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
          <defs><clipPath id="th-clip"><rect x="0" y="0" width={W} height={Math.max(0, front)} /></clipPath></defs>
          <path className="thread-track" d={d} />
          <path className="thread-live" d={d} clipPath="url(#th-clip)" />
        </svg>
        {beads.map((b) => b.photo ? (
          <div key={b.key} className={'thread-bead' + (front >= b.y ? ' lit' : '')} style={{ left: b.x, top: b.y }}>
            <div className="bead-photo" style={{ width: b.w, height: b.h }}><image-slot id={b.id} shape="rounded" radius="13" placeholder={b.cap}></image-slot></div>
            <div className="bead-cap">{b.cap}</div>
          </div>
        ) : (
          <div key={b.key} className={'thread-dot' + (front >= b.y ? ' lit' : '')} style={{ left: b.x, top: b.y }} />
        ))}
      </div>
    );
  }

  const LANDER_MODES = ['fan', 'constellation', 'threaded'];
  function readLanderMode() {
    try {
      const h = new URLSearchParams(location.hash.slice(1)).get('v');
